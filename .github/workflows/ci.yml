name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg do Ubuntu tem libass: roda também o teste de legenda queimada
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          FORCE_ASS_TEST: "1"

  worker-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/worker/Dockerfile -t mercatta-worker .
